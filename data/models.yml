# 3D models shown on the "3D & VR" page.
#
# To publish a model:
#   1. Export it as .glb (binary glTF) – keep it under ~20 MB for mobile.
#   2. Put it in docs/assets/models/ (plus an optional poster image there too).
#   3. Add an entry with `src: "assets/models/my-model.glb"` (and `poster` likewise).
#
# Optional: `ios_src` – a .usdz file for AR Quick Look on iPhone/iPad.
#
# Full web apps (e.g. a three.js/WebXR scene exported as one .html file):
#   put the .html in docs/xr/ and set `app` instead of `src`. It is shown as a
#   wide featured card with a launch button. `size` is shown so visitors on
#   mobile data know what to expect.
#   `devices` lists where it runs: icon is one of computer, phone, headset.

models:
  - title: "Delta vie – the Danube flood of winter 2023–2024"
    description: >-
      Watch the Danube Delta flood during the last major Danube flood (November 2023 – February 2024),
      simulated with the water-flow model developed in DELTA-Hub. Start with a 30-second guided tour
      from the river's entry into the delta to the sea, then explore on your own: tap the delta to read
      water level, depth and current speed. Interface in Romanian.
    tags: [WebXR, Flood simulation, Hydrodynamic model]
    app: xr/delta-vie.html
    poster: assets/models/delta-vie.jpg
    size: "≈ 70 MB – best on Wi-Fi"
    devices:
      - { icon: computer, label: Computer, note: "3D view · mouse" }
      - { icon: phone, label: Phone & tablet, note: "3D view · touch · AR on Android" }
      - { icon: headset, label: Headset, note: "Mixed reality · Meta Quest" }
